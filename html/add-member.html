<!DOCTYPE html>
<html>
<head>
    <title>Add Member</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/avif" href="/images/gym_management_logo.avif">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>

    <div class="header">
        <h2>🏋️ GYM MEMBERSHIP MANAGEMENT</h2>
        <a href="dashboard.html" class="back-btn">← Dashboard</a>
    </div>

    <div class="member-box">

        <h3>➕ Add New Member</h3>

        <div style="padding: 22px 25px 25px;">

            <form id="memberForm">

                <label>Full Name</label>
                <input type="text" name="name" placeholder="Enter full name" required>

                <label>Age</label>
                <input type="number" name="age" placeholder="Enter age" required min="5" max="100">

                <label>Gender</label>
                <select name="gender">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>

                <label>Phone Number</label>
                <input type="tel" name="phone" placeholder="Enter phone number">

                <label>Email</label>
                <input type="email" name="email" placeholder="Enter email address">

                <label>Address</label>
                <textarea name="address" placeholder="Enter address"></textarea>

                <label>Membership Plan</label>
                <select name="plan">
                    <option value="Basic">Basic</option>
                    <option value="Standard">Standard</option>
                    <option value="Premium">Premium</option>
                </select>

                <label>Join Date</label>
                <input type="date" name="joinDate">

                <label>Expiry Date</label>
                <input type="date" name="expiryDate">

                <div class="buttons">
                    <button type="submit">✅ Save Member</button>
                    <button type="reset">✕ Clear</button>
                </div>

            </form>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
