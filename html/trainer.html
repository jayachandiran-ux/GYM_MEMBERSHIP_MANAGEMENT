<!DOCTYPE html>
<html>
<head>
    <title>Trainer Assignment</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/avif" href="/images/gym_management_logo.avif">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>

    <div class="header">
        <h2>🏋️ GYM MEMBERSHIP MANAGEMENT</h2>
        <a href="dashboard.html" class="back-btn">← Dashboard</a>
    </div>

    <div class="trainer-box">

        <h3>🏋️ Assign Trainer</h3>

        <div style="padding: 22px 25px 25px;">

            <form id="trainerForm">

                <label>Member ID</label>
                <input type="number" name="memberId" placeholder="Enter Member ID" required>

                <label>Member Name</label>
                <input type="text" name="memberName" placeholder="Enter Member Name">

                <label>Select Trainer</label>
                <select name="trainer">
                    <option value="Arun">Arun</option>
                    <option value="Karthik">Karthik</option>
                    <option value="Vijay">Vijay</option>
                    <option value="Rahul">Rahul</option>
                </select>

                <label>Specialization</label>
                <select name="specialization">
                    <option value="Weight Loss">🏃 Weight Loss</option>
                    <option value="Body Building">💪 Body Building</option>
                    <option value="Fitness">🤸 Fitness</option>
                    <option value="Yoga">🧘 Yoga</option>
                </select>

                <label>Assigned Date</label>
                <input type="date" name="assignedDate" required>

                <div class="buttons">
                    <button type="submit">✅ Assign Trainer</button>
                    <button type="reset">✕ Clear</button>
                </div>

            </form>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
