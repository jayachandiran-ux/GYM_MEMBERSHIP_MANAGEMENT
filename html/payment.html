<!DOCTYPE html>
<html>
<head>
    <title>Payment</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/avif" href="/images/gym_management_logo.avif">
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>

    <div class="header">
        <h2><img src="/images/gym_management_logo.avif" alt="Logo" style="width:28px;height:28px;object-fit:contain;border-radius:5px;vertical-align:middle;margin-right:8px;background:rgba(255,255,255,0.1);padding:2px;">GYM MEMBERSHIP MANAGEMENT</h2>
        <a href="dashboard.html" class="back-btn">← Dashboard</a>
    </div>

    <div class="payment-box">

        <h3>💳 Record Payment</h3>

        <div style="padding: 22px 25px 25px;">

            <form id="paymentForm">

                <label>Member ID</label>
                <input type="number" name="memberId" placeholder="Enter Member ID" required>

                <label>Amount (₹)</label>
                <input type="number" name="amount" placeholder="Enter amount" required min="1">

                <label>Payment Date</label>
                <input type="date" name="paymentDate" required>

                <label>Payment Method</label>
                <select name="paymentMethod">
                    <option value="Cash">💵 Cash</option>
                    <option value="UPI">📱 UPI</option>
                    <option value="Card">💳 Card</option>
                </select>

                <div class="buttons">
                    <button type="submit">✅ Record Payment</button>
                    <button type="reset">✕ Clear</button>
                </div>

            </form>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
