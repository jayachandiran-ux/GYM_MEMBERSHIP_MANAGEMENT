<!DOCTYPE html>
<html>
<head>
    <title>Admin Registration</title>
    <meta charset="UTF-8">
    <link rel="icon" type="image/avif" href="/images/gym_management_logo.avif">
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="stylesheet" href="css/register.css">
</head>
<body>

    <div class="header">
        <h2><img src="/images/gym_management_logo.avif" alt="Logo" style="width:28px;height:28px;object-fit:contain;border-radius:5px;vertical-align:middle;margin-right:8px;background:rgba(255,255,255,0.1);padding:2px;">GYM MEMBERSHIP MANAGEMENT</h2>
    </div>

    <div class="register-box">

        <h3>Admin Registration</h3>

        <form id="registerForm">

            <label>Full Name</label>
            <input type="text" name="fullname" placeholder="Enter Full Name" required>

            <label>Username</label>
            <input type="text" name="username" placeholder="Enter Username" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter Password" required>

            <label>Confirm Password</label>
            <input type="password" name="confirmPassword" placeholder="Confirm Password" required>

            <div class="buttons">
                <button type="submit">Register</button>
                <button type="reset">Clear</button>
            </div>

        </form>

        <div class="login-link">
            Already have an account? <a href="login.html">Login here</a>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
