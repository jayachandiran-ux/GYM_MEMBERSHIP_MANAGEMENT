<!DOCTYPE html>
<html>
<head>
    <title>Edit Member</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/avif" href="/images/gym_management_logo.avif">
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>

    <div class="header">
        <h2><img src="/images/gym_management_logo.avif" alt="Logo" style="width:28px;height:28px;object-fit:contain;border-radius:5px;vertical-align:middle;margin-right:8px;background:rgba(255,255,255,0.1);padding:2px;">GYM MEMBERSHIP MANAGEMENT</h2>
        <a href="api/member-list" class="back-btn">← Member List</a>
    </div>

    <div class="member-box">

        <h3>✏️ Edit Member</h3>

        <div style="padding: 22px 25px 25px;">

            <form id="editMemberForm">

                <input type="hidden" name="memberId" id="memberId">

                <label>Full Name</label>
                <input type="text" name="name" id="name" placeholder="Full Name" required>

                <label>Age</label>
                <input type="number" name="age" id="age" placeholder="Age" required min="5" max="100">

                <label>Gender</label>
                <select name="gender" id="gender">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>

                <label>Phone Number</label>
                <input type="tel" name="phone" id="phone" placeholder="Phone Number">

                <label>Email</label>
                <input type="email" name="email" id="email" placeholder="Email">

                <label>Address</label>
                <textarea name="address" id="address" placeholder="Address"></textarea>

                <label>Membership Plan</label>
                <select name="plan" id="plan">
                    <option value="Basic">Basic</option>
                    <option value="Standard">Standard</option>
                    <option value="Premium">Premium</option>
                </select>

                <label>Join Date</label>
                <input type="date" name="joinDate" id="joinDate">

                <label>Expiry Date</label>
                <input type="date" name="expiryDate" id="expiryDate">

                <label>Status</label>
                <select name="status" id="status">
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>

                <div class="buttons">
                    <button type="submit">💾 Update Member</button>
                    <button type="button" onclick="location.href='api/member-list'">✕ Cancel</button>
                </div>

            </form>

        </div>
    </div>

    <script>
        // Get member ID from URL
        const params = new URLSearchParams(window.location.search);
        const memberId = params.get('id');

        if (!memberId) {
            alert('No member ID provided');
            window.location.href = '/api/member-list';
        }

        // Load existing member data
        fetch('/api/member/' + memberId)
            .then(r => r.json())
            .then(data => {
                if (!data.success) {
                    alert('Member not found');
                    window.location.href = '/api/member-list';
                    return;
                }
                const m = data.member;
                document.getElementById('memberId').value   = m.member_id;
                document.getElementById('name').value       = m.full_name || '';
                document.getElementById('age').value        = m.age || '';
                document.getElementById('phone').value      = m.phone_number || '';
                document.getElementById('email').value      = m.email || '';
                document.getElementById('address').value    = m.address || '';
                document.getElementById('joinDate').value   = m.join_date || '';
                document.getElementById('expiryDate').value = m.expiry_date || '';

                // Set select values
                setSelect('gender', m.gender);
                setSelect('plan',   m.membership_plan);
                setSelect('status', m.membership_status);
            })
            .catch(() => {
                alert('Failed to load member data');
                window.location.href = '/api/member-list';
            });

        function setSelect(id, value) {
            const el = document.getElementById(id);
            for (let i = 0; i < el.options.length; i++) {
                if (el.options[i].value === value) {
                    el.selectedIndex = i;
                    break;
                }
            }
        }

        // Handle form submit
        document.getElementById('editMemberForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const data = {};
            new FormData(this).forEach((v, k) => data[k] = v);

            fetch('/api/member-update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(r => r.json())
            .then(result => {
                if (result.success) {
                    alert('Member updated successfully!');
                    window.location.href = '/api/member-list';
                } else {
                    alert('Error: ' + (result.message || 'Update failed'));
                }
            })
            .catch(() => alert('Server error. Please try again.'));
        });
    </script>

</body>
</html>
