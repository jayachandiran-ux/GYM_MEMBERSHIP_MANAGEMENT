<!DOCTYPE html>
<html>
<head>
    <title>Login - GYM Management</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/avif" href="/images/gym_management_logo.avif">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-box">

        <div class="login-logo">
            <img src="/images/gym_management_logo.avif" alt="Gym Logo">
        </div>
        <h1>GYM MEMBERSHIP MANAGEMENT</h1>
        <h3>Admin Login Portal</h3>

        <form id="loginForm">

            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   placeholder="Enter your username" required autocomplete="username">

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter your password" required autocomplete="current-password">

            <div class="button-box">
                <button type="submit">🔐 Login</button>
                <button type="reset">✕ Clear</button>
            </div>

        </form>

        <div class="divider">or</div>

        <div class="register-link">
            New admin? <a href="register.html">Register here</a>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
